name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer
        run: npm run package

      - name: Publish Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path "dist" -Filter "*Setup*.exe" -File
          $blockmapFiles = Get-ChildItem -Path "dist" -Filter "*.blockmap" -File
          $latestFile = Get-Item -Path "dist/latest.yml" -ErrorAction SilentlyContinue

          $uploadList = @()
          if ($exeFiles) { $uploadList += $exeFiles.FullName }
          if ($blockmapFiles) { $uploadList += $blockmapFiles.FullName }
          if ($latestFile) { $uploadList += $latestFile.FullName }

          Write-Host "Found $($uploadList.Count) artifacts to upload:"
          $uploadList | ForEach-Object { Write-Host " -> $_" }

          if ($uploadList.Count -eq 0) {
            Write-Error "No build artifacts found in dist/"
            exit 1
          }

          # 优先使用 gh release upload 覆盖更新，若 Release 尚不存在则自动创建
          $releaseExists = gh release view ${{ github.ref_name }} 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release ${{ github.ref_name }} exists. Uploading assets..."
            gh release upload ${{ github.ref_name }} $uploadList --clobber
          } else {
            Write-Host "Creating new Release ${{ github.ref_name }} with assets..."
            gh release create ${{ github.ref_name }} $uploadList --title "Release ${{ github.ref_name }}" --generate-notes
          }
          Write-Host "Release ${{ github.ref_name }} published successfully!"
